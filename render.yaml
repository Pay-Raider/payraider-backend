# Render Blueprint: dashboard > New > Blueprint, pick this repository.
# Creates the PayRaider API (with a disk for its SQLite database) and Redis.
# Variables with sync: false are asked for when the Blueprint is applied.
# The API's disk needs a paid instance; on the free plan the database would
# be wiped on every deploy.
services:
- type: web
  name: payraider-api
  runtime: docker
  dockerfilePath: ./Dockerfile
  dockerContext: .
  plan: starter
  region: frankfurt
  healthCheckPath: /health
  autoDeploy: true
  disk:
    name: data
    mountPath: /data
    sizeGB: 1
  envVars:
  - key: DATABASE_URL
    value: sqlite:///data/payraider.db?mode=rwc
  - key: STELLAR_NETWORK
    value: mainnet
  - key: STELLAR_HORIZON_URL_MAINNET
    value: https://horizon.stellar.org
  - key: STELLAR_RPC_URL_MAINNET
    sync: false
  - key: STELLAR_HORIZON_URL_TESTNET
    value: https://horizon-testnet.stellar.org
  - key: STELLAR_RPC_URL_TESTNET
    value: https://soroban-testnet.stellar.org
  - key: JWT_SECRET
    generateValue: true
  - key: ENCRYPTION_KEY
    sync: false
  - key: SEP10_SERVER_PUBLIC_KEY
    sync: false
  - key: SEP10_HOME_DOMAIN
    sync: false
  - key: CORS_ALLOWED_ORIGINS
    sync: false
  - key: PAYRAIDER_TREASURY_ACCOUNT
    sync: false
  - key: LOGSTASH_ENABLED
    value: 'false'
  - key: BACKUP_ENABLED
    value: 'false'
  - key: REDIS_URL
    fromService:
      type: keyvalue
      name: payraider-redis
      property: connectionString
- type: keyvalue
  name: payraider-redis
  plan: free
  region: frankfurt
  maxmemoryPolicy: allkeys-lru
  ipAllowList: []
